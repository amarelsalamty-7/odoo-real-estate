name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tools
        run: |
          pip install flake8
          sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Python syntax and pyflakes
        run: flake8 real_estate --select=E9,F
      - name: XML well-formedness
        run: find real_estate -name '*.xml' -print0 | xargs -0 xmllint --noout
